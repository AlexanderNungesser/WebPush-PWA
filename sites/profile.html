<!DOCTYPE html>
<html lang="en">
    <head>
        <title>WebPush-PWA</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="icon" type="image/png" href="../content/logo.png">
        <link rel="stylesheet" type="text/css" href="../css/global.css">
        <link rel="stylesheet" type="text/css" href="../css/profile.css">
        <link rel="manifest" type="text/json" href="../manifest.json">
        <noscript>
        <link rel="stylesheet" type="text/css" href="../css/noscript.css">
        </noscript>

        <link rel="stylesheet" type="text/css" href="/SWAC/swac/libs/uikit/css/uikit.min.css">
        <script src="/SWAC/swac/libs/uikit/js/uikit.min.js"></script>
        <script src="/SWAC/swac/libs/uikit/js/uikit-icons.min.js"></script>
        <script src="/SWAC/swac/swac.js" type="module"></script>
        <script src="../js/groupManager.js"></script>
        <script src="../js/navigation.js" type="module"></script>
        <script src="../js/headerLoader.js"></script>
        <script src="../js/profile.js"></script>
        <script src="/SWAC/swac/legacybrowser.js"></script>
    </head>
    <body>
        <div id="header">
            <img src="" alt="Logo" id="header_logo">
            <h1 class="header_title">Profile</h1>
            <div class="header_right">
                <span id="header_streak" class="right_text"></span>
                <img src="../content/streak.png" alt="icon" class="header_streak_icon">
            </div>
        </div>
        <div id="content"> 
           <div id="profile-section" class="uk-flex uk-flex-middle uk-flex-center">    
                <div class="profile-wrapper">
                    <div class="profile-image-wrapper">
                        <svg class="progress-ring" viewBox="0 0 180 180" preserveAspectRatio="xMidYMid meet">
                            <circle class="progress-ring__bg" r="84" cx="90" cy="90"/>
                            <circle class="progress-ring__progress" r="84" cx="90" cy="90" stroke-dasharray="528" stroke-dashoffset="528"/>
                        </svg>
                        <img src="" id="profile-image" class=" uk-border-circle">     
                    </div> 
                    <div id="group_name"></div>
                </div>
                <div class="profile-side-info">
                    <div class="side_info" id="level_wrapper">
                        <img src="../content/level.png" class="side_info_icon">
                        <span id="level"> 12</span>
                    </div>
                    <div class="side_info" id="streak_wrapper">
                        <img src="../content/streak.png" class="side_info_icon">
                        <span id="streak"></span>
                    </div>
                </div>
            </div>
            <div id="achievement-section" class="uk-section-default">
                <div id="achievement_header">Achievements</div>
                <div id="present-achievements" swa="Present TEMPLATE present_webPush_achievements"></div>
            </div>
        </div>
        </div>
        <div id="navigation" swa="Navigation FROM routes.json TEMPLATE nav_webPush_mobile"></div>
        <div class="popup" id="profile_popup">
            <div class="popup-overlay" id="profile_overlay"></div>
            <div class="popup-content">               
                <div id="present_pictures" swa="Present FROM group_picture TEMPLATE present_webPush_images"></div>
            </div>
        </div>
        <div class="popup" id="achievement_popup">
            <div class="popup-overlay" id="achievement_overlay"></div>
            <div class="popup-content" id="achievement_popup_content">      
                <div class="img-row">
                    <div class="img-box">
                        <img src="" alt="">
                        <span class="xp-label"></span>
                    </div>

                    <div class="img-box img-box-center">
                        <img src="" alt="">
                        <span class="xp-label"></span>
                    </div>

                    <div class="img-box">
                        <img src="" alt="">
                        <span class="xp-label"></span>
                    </div>
                </div>         
                <h1 id="achievement_popup_title"></h1>
                <p id="achievement_popup_description"></p>
            </div>
        </div>
    </body>  
</html>
