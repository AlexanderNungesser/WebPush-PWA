<!DOCTYPE html>
<html lang="en">
    <head>
        <title>WebPush-PWA</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="icon" type="image/png" href="files/icons/logo_round.png">
        <link rel="stylesheet" type="text/css" href="css/global.css">
        <link rel="stylesheet" type="text/css" href="css/index.css">
        <link rel="manifest" type="text/json" href="manifest.json">
        <noscript>
        <link rel="stylesheet" type="text/css" href="./css/noscript.css">
        </noscript>

        <link rel="stylesheet" type="text/css" href="/SWAC/swac/libs/uikit/css/uikit.min.css">
        <script src="/SWAC/swac/libs/uikit/js/uikit.min.js"></script>
        <script src="/SWAC/swac/libs/uikit/js/uikit-icons.min.js"></script>
        <script src="/SWAC/swac/swac.js" type="module"></script>
        <script src="./js/index.js" type="module"></script>
        <script src="/SWAC/swac/legacybrowser.js"></script>
    </head>
    <body>
       <div id="login">
            <div id="loginform_wrapper" class="hidden">
                <h2>Login</h2>
                <form id="loginForm" class="uk-form-stacked">
                    <div class="uk-margin">
                        <input id="username"
                            name="username"
                            type="text"
                            placeholder="Username"
                            class="uk-input"
                            required>
                    </div>

                    <div class="uk-margin">
                        <select name="group" id="selectGroup" class="uk-select" required>
                            <option value="">Select Group</option>
                        </select>
                    </div>

                    <div class="uk-margin">
                        <button type="submit" class="uk-button uk-button-default">Login</button>
                    </div>
                </form>
            </div>
            <div id="loading_screen" class="uk-card uk-text-center">
                <div class="uk-margin-medium-bottom">
                    <img src="./files/icons/logo_round.png" class="custom_spinner" alt="Loading">
                </div>
                <span>Loading…</span>
            </div>
        </div>
        <div class="popup" id="popup">
            <div class="popup_content"></div>
            <div class="popup_content">
                <p>Please allow notifications to receive test push notifications.</p>
                <div class="button_row">
                    <button class="uk-button uk-button-primary" id="allow">Allow</button>
                    <button class="uk-button uk-button-default" id="deny">Deny</button>
                </div>
            </div>
        </div>
        <div class="popup" id="error_popup">
            <div class="popup_content"></div>
            <div class="popup_content">
                <h1 id="error_popup_title">Placeholder for error title.</h1>
                <p id="error_popup_message">Placeholder for error message</p>
                <div class="button_row">
                    <button class="uk-button uk-button-primary" id="show_instructions">Instructions</button>
                    <button class="uk-button uk-button-default" id="reload">Reload</button>
                </div>
            </div>
        </div>
        <div class="popup" id="instruction_popup">
            <div class="popup_content"></div>
            <div class="popup_content">
                <h1 id="instruction_popup_title">Notification settings instruction</h1>
                <div id="instruction" swa="Present FROM notification_instruction.json TEMPLATE present_instruction"></div>
                <div class="button_row">
                    <button class="uk-button uk-button-default" id="Close">Close</button>
                </div>
            </div>
        </div>
    </body>
</html>
